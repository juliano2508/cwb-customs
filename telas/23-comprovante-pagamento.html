<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Comprovante</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="device">
  <div class="screen" style="justify-content:center;">
    <div class="content-x" style="text-align:center;">
      <div style="width:56px; height:56px; border-radius:50%; background: rgba(74,122,92,0.2); color: var(--ok); display:flex; align-items:center; justify-content:center; font-size:26px; margin: 0 auto var(--space-4);">✓</div>
      <h2>Pagamento confirmado</h2>
      <p style="margin-bottom: var(--space-5);">Recibo enviado para seu e-mail cadastrado</p>

      <div class="card-flat" style="text-align:left;">
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-2); font-size:13px;">
          <span style="color: var(--text-muted);">Oficina</span><span>Oficina do Bairro</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-2); font-size:13px;">
          <span style="color: var(--text-muted);">Veículo</span><span>Civic 2018</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-2); font-size:13px;">
          <span style="color: var(--text-muted);">Forma de pagamento</span><span>Pix</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-2); font-size:13px;">
          <span style="color: var(--text-muted);">Data</span><span>01/09/2026</span>
        </div>
        <div style="border-top:1px solid var(--line); margin-top: var(--space-2); padding-top: var(--space-2); display:flex; justify-content:space-between; font-weight:700;">
          <span>Total pago</span><span style="color: var(--accent);">R$ 390,00</span>
        </div>
      </div>

      <a href="12-avaliacao.html" class="btn btn-primary" style="margin-top: var(--space-4);">Avaliar atendimento</a>
    </div>
  </div>
</div>
</body>
</html>
