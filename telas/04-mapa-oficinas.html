<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWB Customs — Oficinas próximas</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="root"></div>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script>
CWB.page({ roles: ['cliente'], title: 'Oficinas próximas', tab: 'oficinas', back: '03-home-cliente.html',
  render(el) {
    let busca = '', esp = '';
    el.innerHTML = `
      <div class="map" role="img" aria-label="Mapa da região de Curitiba">🗺️ mapa da região — Curitiba, PR
        <span class="pin" style="top:45%;left:30%">📍</span><span class="pin" style="top:58%;left:60%">📍</span><span class="pin" style="top:28%;left:68%;color:var(--accent)">📍</span>
      </div>
      <div style="margin-top:24px">
        <div class="field"><input type="search" id="busca" placeholder="Buscar por nome, bairro ou serviço..." aria-label="Buscar oficinas"></div>
        <div class="chips" id="chips"></div>
        <div id="lista"></div>
      </div>`;
    const chips = document.getElementById('chips');
    chips.innerHTML = ['Todas'].concat(DB.ESPECIALIDADES).map((e, i) => `<button class="chip ${i === 0 ? 'active' : ''}" data-e="${i === 0 ? '' : e}">${e}</button>`).join('');
    function lista() {
      DB.load();
      const t = busca.toLowerCase();
      const ofs = DB.where('oficinas', (o) => o.status === 'ativa'
        && (!esp || o.especialidades.includes(esp))
        && (!t || (o.nome + ' ' + o.bairro + ' ' + o.especialidades.join(' ')).toLowerCase().includes(t))).sort((a, b) => a.dist - b.dist);
      document.getElementById('lista').innerHTML = ofs.length ? ofs.map((o) => {
        const n = DB.nota(o.id);
        return `<a href="05-perfil-oficina.html?id=${o.id}" class="list-item" style="text-decoration:none;">
          <div class="avatar">${CWB.inicial(o.nome)}</div>
          <div style="flex:1;min-width:0">
            <div class="row"><strong>${CWB.esc(o.nome)}</strong><span style="font-size:13px;color:var(--accent)">${o.dist.toFixed(1).replace('.', ',')} km</span></div>
            <p style="margin:2px 0 0;font-size:13px">${n.qtd ? '⭐ ' + n.nota.toFixed(1).replace('.', ',') + ' · ' : ''}${CWB.esc(o.especialidades.join(', '))}</p>
          </div></a>`;
      }).join('') : '<div class="empty"><strong>Nenhuma oficina encontrada</strong><p>Tente outro termo ou especialidade.</p></div>';
    }
    document.getElementById('busca').addEventListener('input', (e) => { busca = e.target.value; lista(); });
    chips.addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      esp = b.dataset.e; chips.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c === b)); lista();
    });
    lista();
  } });
</script>
</body>
</html>
