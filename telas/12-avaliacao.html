<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Avaliação</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="device">
  <div class="screen" style="justify-content:center;">
    <div class="content-x" style="text-align:center;">
      <div style="font-size:40px; margin-bottom: var(--space-3);">🔧</div>
      <h2>Serviço concluído!</h2>
      <p style="margin-bottom: var(--space-5);">Como foi sua experiência com a Oficina do Bairro?</p>

      <div style="font-size:34px; letter-spacing:8px; margin-bottom: var(--space-5);">
        ⭐⭐⭐⭐⭐
      </div>

      <form action="03-home-cliente.html">
        <div class="field" style="text-align:left;">
          <label for="coment">Comentário (opcional)</label>
          <textarea id="coment" rows="4" placeholder="Conte como foi o atendimento..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enviar avaliação</button>
      </form>

      <a href="03-home-cliente.html" class="btn btn-text" style="display:block; margin-top: var(--space-2);">Pular</a>
    </div>
  </div>
</div>
</body>
</html>
