<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Entrar</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="device">
  <div class="screen" style="padding-bottom: 0; justify-content: center;">
    <div class="content-x" style="text-align:center; margin-bottom: var(--space-6);">
      <div style="font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: 0.5px;">
        CURITIBA <span style="color: var(--accent);">CUSTOMS</span>
      </div>
      <p style="margin-top: 4px; font-size: 13px;">a oficina do seu bairro, sem enrolação</p>
    </div>

    <div class="content-x">
      <form action="03-home-cliente.html">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seuemail@exemplo.com">
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••">
        </div>

        <div style="text-align:right; margin-bottom: var(--space-4);">
          <a href="#" style="font-size: 13px; color: var(--text-muted); text-decoration:none;">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <div style="text-align:center; margin: var(--space-4) 0; color: var(--text-muted); font-size: 13px;">
        ou
      </div>

      <a href="02-cadastro.html" class="btn btn-outline">Criar conta</a>
    </div>
  </div>
</div>
</body>
</html>
