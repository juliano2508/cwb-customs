<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Funcionários</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="topbar">
      <a href="13-home-oficina.html" class="back">←</a>
      <h1>Funcionários</h1>
      <span class="spacer"></span>
    </div>

    <div class="content-x" style="margin-top: var(--space-4);">
      <div class="list-item">
        <div class="avatar">ER</div>
        <div style="flex:1;">
          <strong style="font-size:14px;">Emanuel Ribeiro</strong>
          <p style="margin:2px 0 0; font-size:13px;">Mecânica geral</p>
        </div>
        <span style="color: var(--text-muted); font-size:18px;">✎</span>
      </div>
      <div class="list-item">
        <div class="avatar">JM</div>
        <div style="flex:1;">
          <strong style="font-size:14px;">Juliano Memmo</strong>
          <p style="margin:2px 0 0; font-size:13px;">Elétrica / injeção</p>
        </div>
        <span style="color: var(--text-muted); font-size:18px;">✎</span>
      </div>
      <div class="list-item">
        <div class="avatar">PC</div>
        <div style="flex:1;">
          <strong style="font-size:14px;">Pedro Cavalli</strong>
          <p style="margin:2px 0 0; font-size:13px;">Estética / funilaria</p>
        </div>
        <span style="color: var(--text-muted); font-size:18px;">✎</span>
      </div>
      <div class="list-item">
        <div class="avatar">VN</div>
        <div style="flex:1;">
          <strong style="font-size:14px;">Vini Nights</strong>
          <p style="margin:2px 0 0; font-size:13px;">Tuning / performance</p>
        </div>
        <span style="color: var(--text-muted); font-size:18px;">✎</span>
      </div>

      <div class="card" style="margin-top: var(--space-5);">
        <h3 style="margin-bottom: var(--space-3); color: var(--text);">Adicionar funcionário</h3>
        <div class="field">
          <label for="nomef">Nome</label>
          <input type="text" id="nomef" placeholder="Nome completo">
        </div>
        <div class="field">
          <label for="esp">Especialidade</label>
          <select id="esp">
            <option>Mecânica geral</option>
            <option>Elétrica / injeção</option>
            <option>Estética / funilaria</option>
            <option>Tuning / performance</option>
          </select>
        </div>
        <button class="btn btn-primary">Salvar</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
