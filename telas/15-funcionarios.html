<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWB Customs</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="root"></div>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script>
CWB.page({ roles: ['oficina'], title: 'Funcionários', tab: 'home', back: '13-home-oficina.html', render(el, u) {
  CWB.crud(el, {
    table: 'funcionarios', where: (f) => f.oficinaId == u.oficinaId, addTitle: 'Novo funcionário', empty: 'Nenhum funcionário cadastrado.',
    intro: 'Funcionários com e-mail recebem acesso de <strong>mecânico</strong> (senha inicial 123456).',
    item: (f) => ({ avatar: CWB.inicial(f.nome), title: f.nome, sub: f.especialidade + (f.email ? ' · ' + f.email : '') }),
    fields: [
      { key: 'nome', label: 'Nome completo', required: true, placeholder: 'Ex: João Silva' },
      { key: 'especialidade', label: 'Especialidade', required: true, placeholder: 'Ex: Mecânica geral' },
      { key: 'email', label: 'E-mail de acesso (opcional)', type: 'email', placeholder: 'mecanico@email.com', pattern: /^[^@\s]+@[^@\s]+\.[^@\s]+$/, patternMsg: 'Informe um e-mail válido.' },
    ],
    defaults: () => ({ oficinaId: u.oficinaId }),
    validate: (d, id) => {
      if (d.email && DB.where('usuarios', (x) => x.email.toLowerCase() === d.email.toLowerCase() && !(DB.get('funcionarios', id) && x.funcionarioId == id))[0]) return 'Este e-mail já está em uso.';
    },
    afterSave: (f) => {
      const ex = DB.where('usuarios', (x) => x.funcionarioId == f.id)[0];
      if (f.email && !ex) DB.insert('usuarios', { perfil: 'mecanico', nome: f.nome, email: f.email, senha: '123456', oficinaId: u.oficinaId, funcionarioId: f.id });
      else if (ex) DB.update('usuarios', ex.id, { nome: f.nome, email: f.email || ex.email });
    },
    afterDelete: (f) => {
      DB.where('usuarios', (x) => x.funcionarioId == f.id).forEach((x) => DB.remove('usuarios', x.id));
      DB.where('agendamentos', (a) => a.mecanicoId == f.id).forEach((a) => DB.update('agendamentos', a.id, { mecanicoId: null }));
    },
  });
} });
</script>
</body>
</html>
