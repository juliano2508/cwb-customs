<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWB Customs</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="root"></div>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script>
const BACK = { cliente: '03-home-cliente.html', oficina: '13-home-oficina.html', mecanico: '30-home-mecanico.html', agente: '31-gestao-oficinas.html' };
CWB.page({ title: 'Perfil', tab: 'perfil', back: (u) => BACK[u.perfil], render(el, u) {
  const of = u.perfil === 'oficina' ? DB.get('oficinas', u.oficinaId) : null;
  const ROT = { cliente: 'Cliente', oficina: 'Oficina', mecanico: 'Mecânico', agente: 'Agente CWB' };
  const links = {
    cliente: [['22-meus-veiculos.html', '🚗', 'Meus veículos'], ['24-historico-servicos.html', '🧾', 'Histórico de serviços'], ['19-sinistro.html', '🛡', 'Abrir sinistro'], ['08-orcamento.html', '📝', 'Pedir orçamento'], ['21-comparar-orcamentos.html', '⚖️', 'Comparar orçamentos']],
    oficina: [['24-historico-servicos.html', '🧾', 'Histórico de serviços'], ['28-relatorios.html', '📊', 'Relatórios']],
    mecanico: [], agente: [['28-relatorios.html', '📊', 'Relatórios da plataforma']],
  }[u.perfil];
  el.innerHTML = `
    <div style="text-align:center;margin-bottom:16px"><div class="avatar" style="width:64px;height:64px;font-size:22px;margin:0 auto 8px">${CWB.esc(CWB.inicial(u.nome))}</div><h2>${CWB.esc(u.nome)}</h2><p class="muted">${ROT[u.perfil]} · ${CWB.esc(u.email)}</p></div>
    ${links.map((l) => `<a class="list-item" href="${l[0]}" style="text-decoration:none"><span style="font-size:20px">${l[1]}</span><strong style="flex:1;font-size:14px">${l[2]}</strong>›</a>`).join('')}
    <div class="card" style="margin-top:16px"><h3 style="color:var(--text);margin-bottom:12px">Meus dados</h3>
      <form id="fd" novalidate>
        <div class="field"><label for="nome">Nome</label><input id="nome" value="${CWB.esc(u.nome)}"><div class="err" id="e_nome"></div></div>
        ${u.perfil === 'cliente' ? `<div class="field"><label for="tel">Telefone</label><input id="tel" inputmode="tel" value="${CWB.esc(u.telefone || '')}" placeholder="(41) 99999-9999"><div class="err" id="e_tel"></div></div>` : ''}
        ${of ? `<div class="field"><label for="end">Endereço</label><input id="end" value="${CWB.esc(of.endereco)}"></div>
          <div class="field"><label for="bai">Bairro</label><input id="bai" value="${CWB.esc(of.bairro)}"></div>
          <div class="field"><label for="hor">Horário de funcionamento</label><input id="hor" value="${CWB.esc(of.horario)}"></div>
          <div class="field"><label for="sob">Sobre a oficina</label><textarea id="sob" rows="3">${CWB.esc(of.sobre)}</textarea></div>
          <div class="field"><label>Especialidades</label><div>${DB.ESPECIALIDADES.map((e) => `<label class="check"><input type="checkbox" value="${e}" ${of.especialidades.includes(e) ? 'checked' : ''}>${e}</label>`).join('')}</div></div>
          <label class="check"><input type="checkbox" id="aberta" ${of.aberta ? 'checked' : ''}>Aberta para novos agendamentos</label>` : ''}
        <button class="btn btn-primary" type="submit" style="margin-top:8px">Salvar dados</button>
      </form></div>
    <div class="card"><h3 style="color:var(--text);margin-bottom:12px">Alterar senha</h3>
      <form id="fs" novalidate>
        <div class="field"><label for="sa">Senha atual</label><input id="sa" type="password" autocomplete="current-password"><div class="err" id="e_sa"></div></div>
        <div class="field"><label for="sn">Nova senha (mín. 6 caracteres)</label><input id="sn" type="password" autocomplete="new-password"><div class="err" id="e_sn"></div></div>
        <button class="btn btn-outline" type="submit">Alterar senha</button></form></div>
    <button class="btn btn-danger" id="sair">Sair da conta</button>
    <button class="btn btn-text" id="reset" style="display:block;margin-top:8px">Restaurar dados de demonstração</button>`;
  document.getElementById('fd').addEventListener('submit', (e) => {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    if (nome.length < 3) { document.getElementById('e_nome').textContent = 'Informe seu nome.'; return; }
    const patch = { nome };
    if (u.perfil === 'cliente') {
      const t = document.getElementById('tel').value.trim();
      if (t && t.replace(/\D/g, '').length < 10) { document.getElementById('e_tel').textContent = 'Telefone inválido.'; return; }
      patch.telefone = t;
    }
    DB.update('usuarios', u.id, patch);
    if (of) {
      const esp = [...el.querySelectorAll('.check input[type=checkbox][value]')].filter((c) => c.checked).map((c) => c.value);
      if (!esp.length) { CWB.toast('Marque ao menos uma especialidade.', 'err'); return; }
      DB.update('oficinas', of.id, { endereco: document.getElementById('end').value.trim(), bairro: document.getElementById('bai').value.trim(), horario: document.getElementById('hor').value.trim(), sobre: document.getElementById('sob').value.trim(), especialidades: esp, aberta: document.getElementById('aberta').checked, nome });
    }
    if (u.perfil === 'mecanico') DB.update('funcionarios', u.funcionarioId, { nome });
    CWB.toast('Dados salvos.');
  });
  document.getElementById('fs').addEventListener('submit', (e) => {
    e.preventDefault();
    const a = document.getElementById('sa').value, n = document.getElementById('sn').value;
    document.getElementById('e_sa').textContent = a === u.senha ? '' : 'Senha atual incorreta.';
    document.getElementById('e_sn').textContent = n.length >= 6 ? '' : 'Mínimo de 6 caracteres.';
    if (a !== u.senha || n.length < 6) return;
    DB.update('usuarios', u.id, { senha: n }); e.target.reset(); CWB.toast('Senha alterada.');
  });
  document.getElementById('sair').addEventListener('click', () => { Auth.logout(); location.href = '01-login.html'; });
  document.getElementById('reset').addEventListener('click', async () => { if (await CWB.confirmar('Apagar tudo e voltar aos dados de demonstração?', 'Restaurar')) { DB.reset(); Auth.logout(); location.href = '01-login.html'; } });
} });
</script>
</body>
</html>
