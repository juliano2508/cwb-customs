<!DOCTYPE html>
<html lang="pt-br">
<head>

<title>Curitiba Customs — Acompanhamento</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .timeline { position:relative; padding-left: 28px; }
  .tl-item { position:relative; padding-bottom: 28px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content:''; position:absolute; left:-28px; top:2px; width:14px; height:14px;
    border-radius:50%; background: var(--bg-card); border: 2px solid var(--line);
  }
  .tl-item.done::before { background: var(--ok); border-color: var(--ok); }
  .tl-item.current::before { background: var(--accent); border-color: var(--accent); }
  .tl-item::after {
    content:''; position:absolute; left:-22px; top:16px; width:2px; height:100%;
    background: var(--line);
  }
  .tl-item:last-child::after { display:none; }
</style>
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="topbar">

        </div>
