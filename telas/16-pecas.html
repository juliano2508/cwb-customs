<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWB Customs</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="root"></div>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script>
CWB.page({ roles: ['oficina'], title: 'Estoque de peças', tab: 'home', back: '13-home-oficina.html', render(el, u) {
  CWB.crud(el, {
    table: 'pecas', where: (p) => p.oficinaId == u.oficinaId, addTitle: 'Nova peça', empty: 'Estoque vazio.',
    item: (p) => ({ title: p.nome, sub: `${p.codigo} · ${CWB.money(p.preco)} · ${p.qtd} un.`, badge: p.qtd <= 3 ? CWB.badge('Estoque baixo', 'danger') : '' }),
    fields: [
      { key: 'nome', label: 'Nome da peça', required: true },
      { key: 'codigo', label: 'Código', required: true, placeholder: 'Ex: FO-2201' },
      { key: 'qtd', label: 'Quantidade em estoque', type: 'number', required: true, min: 0 },
      { key: 'preco', label: 'Preço de venda (R$)', type: 'money', required: true },
    ],
    defaults: () => ({ oficinaId: u.oficinaId }),
    validate: (d, id) => (Number.isInteger(d.qtd) ? null : 'A quantidade deve ser um número inteiro.'),
  });
} });
</script>
</body>
</html>
