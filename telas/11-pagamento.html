<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Pagamento</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="topbar">
      <a href="10-vistoria.html" class="back">←</a>
      <h1>Pagamento</h1>
      <span class="spacer"></span>
    </div>

    <div class="content-x" style="margin-top: var(--space-4);">
      <h3 style="margin-bottom: var(--space-3);">Resumo do serviço</h3>

      <div class="card-flat">
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-2); font-size:14px;">
          <span>Troca de óleo</span><span>R$ 120,00</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-2); font-size:14px;">
          <span>Revisão elétrica</span><span>R$ 180,00</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-2); font-size:14px;">
          <span>Mão de obra</span><span>R$ 90,00</span>
        </div>
        <div style="border-top:1px solid var(--line); margin-top: var(--space-2); padding-top: var(--space-2); display:flex; justify-content:space-between; font-weight:700;">
          <span>Total</span><span style="color: var(--accent);">R$ 390,00</span>
        </div>
      </div>

      <h3 style="margin: var(--space-4) 0 var(--space-3);">Forma de pagamento</h3>

      <div class="field">
        <select>
          <option>Pix</option>
          <option>Cartão de crédito</option>
          <option>Cartão de débito</option>
          <option>Dinheiro na retirada</option>
        </select>
      </div>

      <a href="23-comprovante-pagamento.html" class="btn btn-primary" style="margin-top: var(--space-2);">Confirmar pagamento</a>
    </div>
  </div>
</div>
</body>
</html>
