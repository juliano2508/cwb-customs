<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWB Customs</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="root"></div>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script>
CWB.page({ roles: ['cliente'], title: 'Meus veículos', tab: 'perfil', back: '20-perfil.html', render(el, u) {
  const ano = new Date().getFullYear() + 1;
  CWB.crud(el, {
    table: 'veiculos', where: (v) => v.donoId == u.id, addTitle: 'Novo veículo', empty: 'Nenhum veículo cadastrado.',
    item: (v) => ({ title: `${v.modelo} ${v.ano}`, sub: `${v.placa} · ${v.cor}` }),
    fields: [
      { key: 'modelo', label: 'Marca e modelo', required: true, placeholder: 'Ex: Honda Civic' },
      { key: 'ano', label: 'Ano', type: 'number', required: true, min: 1950 },
      { key: 'placa', label: 'Placa', required: true, placeholder: 'ABC-1D23', pattern: /^[A-Za-z]{3}-?\d[A-Za-z0-9]\d{2}$/, patternMsg: 'Placa inválida (ex: ABC-1D23).' },
      { key: 'cor', label: 'Cor', required: true },
    ],
    defaults: () => ({ donoId: u.id }),
    validate: (d) => (!Number.isInteger(d.ano) || d.ano < 1950 || d.ano > ano ? 'Ano inválido.' : (d.placa = d.placa.toUpperCase().replace(/^([A-Z]{3})(?!-)/, '$1-'), null)),
    canDelete: (v) => (DB.where('agendamentos', (a) => a.veiculoId == v.id)[0] || DB.where('orcamentos', (o) => o.veiculoId == v.id)[0] ? 'Este veículo tem serviços ou orçamentos vinculados e não pode ser excluído.' : null),
  });
} });
</script>
</body>
</html>
