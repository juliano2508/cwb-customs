<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Meus veículos</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="topbar">
      <a href="20-notificacoes.html" class="back">←</a>
      <h1>Meus veículos</h1>
      <span class="spacer"></span>
    </div>

    <div class="content-x" style="margin-top: var(--space-4);">
      <div class="list-item">
        <div class="avatar">🚗</div>
        <div style="flex:1;">
          <strong style="font-size:14px;">Honda Civic 2018</strong>
          <p style="margin:2px 0 0; font-size:13px;">Placa ABC-1D23 · Prata</p>
        </div>
        <span style="color: var(--text-muted); font-size:18px;">✎</span>
      </div>
      <div class="list-item">
        <div class="avatar">🚗</div>
        <div style="flex:1;">
          <strong style="font-size:14px;">Fiat Uno 2012</strong>
          <p style="margin:2px 0 0; font-size:13px;">Placa XYZ-9F45 · Branco</p>
        </div>
        <span style="color: var(--text-muted); font-size:18px;">✎</span>
      </div>

      <div class="card" style="margin-top: var(--space-5);">
        <h3 style="margin-bottom: var(--space-3); color: var(--text);">Adicionar veículo</h3>
        <div class="field">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" placeholder="Ex: Volkswagen Gol 2015">
        </div>
        <div class="field">
          <label for="placa">Placa</label>
          <input type="text" id="placa" placeholder="ABC-1D23">
        </div>
        <div class="field">
          <label for="cor">Cor</label>
          <input type="text" id="cor" placeholder="Ex: Prata">
        </div>
        <button class="btn btn-primary">Salvar veículo</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
