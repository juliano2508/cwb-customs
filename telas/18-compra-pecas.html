<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Comprar peças</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="topbar">
      <a href="16-pecas.html" class="back">←</a>
      <h1>Fornecedores</h1>
      <span class="spacer"></span>
    </div>

    <div class="content-x" style="margin-top: var(--space-4);">
      <div class="field" style="margin-bottom: var(--space-4);">
        <input type="text" placeholder="Buscar peça ou fornecedor...">
      </div>

      <div class="card-flat">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong style="font-size:14px;">Pastilha de freio dianteira</strong>
            <p style="margin:2px 0 0; font-size:13px;">AutoPeças Curitiba · entrega em 2 dias</p>
          </div>
          <span style="color: var(--accent); font-weight:700;">R$ 78,00</span>
        </div>
      </div>
      <div class="card-flat">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong style="font-size:14px;">Vela de ignição (kit 4un)</strong>
            <p style="margin:2px 0 0; font-size:13px;">Distribuidora PR · entrega em 1 dia</p>
          </div>
          <span style="color: var(--accent); font-weight:700;">R$ 76,00</span>
        </div>
      </div>
      <div class="card-flat">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong style="font-size:14px;">Amortecedor dianteiro</strong>
            <p style="margin:2px 0 0; font-size:13px;">AutoPeças Curitiba · entrega em 3 dias</p>
          </div>
          <span style="color: var(--accent); font-weight:700;">R$ 195,00</span>
        </div>
      </div>

      <button class="btn btn-primary" style="margin-top: var(--space-3);">Adicionar ao carrinho</button>
    </div>
  </div>
</div>
</body>
</html>
