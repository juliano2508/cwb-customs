<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWB Customs — Criar conta</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="root"></div>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script>
CWB.publico({ title: 'Criar conta', render(el) {
  el.style.paddingBottom = '24px';
  el.innerHTML = `
    <div class="topbar"><a href="01-login.html" class="back" aria-label="Voltar">←</a><h1>Criar conta</h1><span class="spacer"></span></div>
    <div class="content-x pad">
      <div class="toggle" role="tablist">
        <button type="button" id="t-cliente" class="active">Sou cliente</button>
        <button type="button" id="t-oficina">Sou oficina</button>
      </div>

      <form id="fc" novalidate>
        <div class="field"><label for="c_nome">Nome completo</label><input id="c_nome" placeholder="Seu nome"><div class="err" id="ec_nome"></div></div>
        <div class="field"><label for="c_email">E-mail</label><input id="c_email" type="email" placeholder="seuemail@exemplo.com"><div class="err" id="ec_email"></div></div>
        <div class="field"><label for="c_tel">Telefone</label><input id="c_tel" type="tel" placeholder="(41) 99999-9999"><div class="err" id="ec_tel"></div></div>
        <div class="field"><label for="c_senha">Senha (mín. 6 caracteres)</label><input id="c_senha" type="password" placeholder="••••••••"><div class="err" id="ec_senha"></div></div>
        <button class="btn btn-primary" type="submit">Criar conta de cliente</button>
      </form>

      <form id="fo" novalidate hidden>
        <div class="field"><label for="o_nome">Nome da oficina</label><input id="o_nome" placeholder="Ex: Oficina do Bairro"><div class="err" id="eo_nome"></div></div>
        <div class="field"><label for="o_cnpj">CNPJ</label><input id="o_cnpj" inputmode="numeric" placeholder="00.000.000/0001-00"><div class="err" id="eo_cnpj"></div></div>
        <div class="field"><label for="o_end">Endereço</label><input id="o_end" placeholder="Rua, número"><div class="err" id="eo_end"></div></div>
        <div class="field"><label for="o_bairro">Bairro</label><input id="o_bairro" placeholder="Ex: Água Verde"><div class="err" id="eo_bairro"></div></div>
        <div class="field"><label>Especialidades</label>
          <div style="display:flex; flex-wrap:wrap">${DB.ESPECIALIDADES.map((e) => `<label class="check"><input type="checkbox" name="esp" value="${e}">${e}</label>`).join('')}</div>
          <div class="err" id="eo_esp"></div></div>
        <div class="field"><label for="o_email">E-mail comercial</label><input id="o_email" type="email" placeholder="contato@suaoficina.com"><div class="err" id="eo_email"></div></div>
        <div class="field"><label for="o_senha">Senha (mín. 6 caracteres)</label><input id="o_senha" type="password" placeholder="••••••••"><div class="err" id="eo_senha"></div></div>
        <p class="muted">Depois do cadastro, um Agente da plataforma analisa e aprova sua oficina como parceira.</p>
        <button class="btn btn-primary" type="submit">Criar conta de oficina</button>
      </form>
    </div>`;

  const $ = (id) => document.getElementById(id);
  const fc = $('fc'), fo = $('fo');
  function aba(t) {
    $('t-cliente').classList.toggle('active', t === 'cliente');
    $('t-oficina').classList.toggle('active', t === 'oficina');
    fc.hidden = t !== 'cliente'; fo.hidden = t !== 'oficina';
  }
  $('t-cliente').onclick = () => aba('cliente');
  $('t-oficina').onclick = () => aba('oficina');

  const set = (p, k, m) => { $('e' + p + '_' + k).textContent = m || ''; return !m; };
  const emailOk = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  const emailLivre = (e) => !DB.where('usuarios', (u) => u.email.toLowerCase() === e.toLowerCase())[0];

  fc.addEventListener('submit', (ev) => {
    ev.preventDefault(); DB.load();
    const nome = $('c_nome').value.trim(), email = $('c_email').value.trim(), tel = $('c_tel').value.trim(), senha = $('c_senha').value;
    let ok = true;
    ok = set('c', 'nome', nome.length < 3 ? 'Informe seu nome completo.' : '') && ok;
    ok = set('c', 'email', !emailOk(email) ? 'E-mail inválido.' : !emailLivre(email) ? 'Este e-mail já está cadastrado.' : '') && ok;
    ok = set('c', 'tel', tel.replace(/\D/g, '').length < 10 ? 'Informe DDD e telefone.' : '') && ok;
    ok = set('c', 'senha', senha.length < 6 ? 'A senha precisa ter ao menos 6 caracteres.' : '') && ok;
    if (!ok) return;
    const u = DB.insert('usuarios', { perfil: 'cliente', nome, email, senha, telefone: tel });
    Auth.set(u.id);
    location.href = Auth.home('cliente');
  });

  fo.addEventListener('submit', (ev) => {
    ev.preventDefault(); DB.load();
    const nome = $('o_nome').value.trim(), cnpj = $('o_cnpj').value.trim(), end = $('o_end').value.trim(), bairro = $('o_bairro').value.trim(), email = $('o_email').value.trim(), senha = $('o_senha').value;
    const esp = [...fo.querySelectorAll('[name=esp]:checked')].map((c) => c.value);
    let ok = true;
    ok = set('o', 'nome', nome.length < 3 ? 'Informe o nome da oficina.' : '') && ok;
    ok = set('o', 'cnpj', cnpj.replace(/\D/g, '').length !== 14 ? 'O CNPJ deve ter 14 dígitos.' : '') && ok;
    ok = set('o', 'end', !end ? 'Informe o endereço.' : '') && ok;
    ok = set('o', 'bairro', !bairro ? 'Informe o bairro.' : '') && ok;
    ok = set('o', 'esp', !esp.length ? 'Escolha ao menos uma especialidade.' : '') && ok;
    ok = set('o', 'email', !emailOk(email) ? 'E-mail inválido.' : !emailLivre(email) ? 'Este e-mail já está cadastrado.' : '') && ok;
    ok = set('o', 'senha', senha.length < 6 ? 'A senha precisa ter ao menos 6 caracteres.' : '') && ok;
    if (!ok) return;
    const of = DB.insert('oficinas', { nome, cnpj, endereco: end, bairro, dist: +(1 + Math.random() * 5).toFixed(1), especialidades: esp, sobre: 'Nova oficina parceira.', status: 'pendente', aberta: true, horario: 'Seg a sex, 8h às 18h', notaBase: 0, qtdBase: 0 });
    const u = DB.insert('usuarios', { perfil: 'oficina', nome, email, senha, oficinaId: of.id });
    DB.notifyPerfil('agente', `${nome} solicitou cadastro como oficina parceira.`, '31-gestao-oficinas.html', 'parceira');
    Auth.set(u.id);
    location.href = Auth.home('oficina');
  });
}});
</script>
</body>
</html>
