<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Criar conta</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .toggle-btn {
    flex:1; padding:12px; border:none; font-weight:600;
    font-family: var(--font-body); cursor:pointer; font-size:14px;
    background: transparent; color: var(--text-muted);
  }
  .toggle-btn.active { background: var(--accent); color:#17181A; }
  .form-panel { display:none; }
  .form-panel.active { display:block; }
</style>
</head>
<body>
<div class="device">
  <div class="screen" style="padding-bottom: var(--space-4);">
    <div class="topbar">
      <a href="01-login.html" class="back">←</a>
      <h1>Criar conta</h1>
      <span class="spacer"></span>
    </div>

    <div class="content-x" style="margin-top: var(--space-4);">

      <div style="display:flex; border: 1px solid var(--line); border-radius: var(--radius); overflow:hidden; margin-bottom: var(--space-4);">
        <button type="button" id="btn-cliente" class="toggle-btn active" onclick="mostrar('cliente')">Sou cliente</button>
        <button type="button" id="btn-oficina" class="toggle-btn" onclick="mostrar('oficina')">Sou oficina</button>
      </div>

      <!-- Formulário CLIENTE -->
      <div id="painel-cliente" class="form-panel active">
        <form action="03-home-cliente.html">
          <div class="field">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Seu nome">
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com">
          </div>
          <div class="field">
            <label for="tel">Telefone</label>
            <input type="tel" id="tel" placeholder="(41) 99999-9999">
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: var(--space-2);">Criar conta de cliente</button>
        </form>
      </div>

      <!-- Formulário OFICINA -->
      <div id="painel-oficina" class="form-panel">
        <form action="13-home-oficina.html">
          <div class="field">
            <label for="nome-of">Nome da oficina</label>
            <input type="text" id="nome-of" placeholder="Ex: Oficina do Bairro">
          </div>
          <div class="field">
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" placeholder="00.000.000/0001-00">
          </div>
          <div class="field">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" placeholder="Rua, número, bairro">
          </div>
          <div class="field">
            <label for="especialidades">Especialidades</label>
            <select id="especialidades">
              <option>Mecânica geral</option>
              <option>Elétrica / injeção</option>
              <option>Estética / funilaria</option>
              <option>Tuning / performance</option>
              <option>Lava-car</option>
            </select>
          </div>
          <div class="field">
            <label for="email-of">E-mail comercial</label>
            <input type="email" id="email-of" placeholder="contato@suaoficina.com">
          </div>
          <div class="field">
            <label for="senha-of">Senha</label>
            <input type="password" id="senha-of" placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: var(--space-2);">Criar conta de oficina</button>
        </form>
      </div>

    </div>
  </div>
</div>

<script>
  function mostrar(tipo) {
    document.getElementById('btn-cliente').classList.toggle('active', tipo === 'cliente');
    document.getElementById('btn-oficina').classList.toggle('active', tipo === 'oficina');
    document.getElementById('painel-cliente').classList.toggle('active', tipo === 'cliente');
    document.getElementById('painel-oficina').classList.toggle('active', tipo === 'oficina');
  }
</script>
</body>
</html>
