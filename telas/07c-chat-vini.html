<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curitiba Customs — Chat</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; line-height:1.4; }
  .msg-in { background: var(--bg-card); border: 1px solid var(--line); align-self:flex-start; border-bottom-left-radius:2px; }
  .msg-out { background: var(--accent); color:#17181A; align-self:flex-end; border-bottom-right-radius:2px; margin-left:auto; }
  .chat-body { flex:1; display:flex; flex-direction:column; padding: var(--space-4); overflow-y:auto; }
</style>
</head>
<body>
<div class="device">
  <div class="screen" style="padding-bottom: 0;">
    <div class="topbar">
      <a href="05c-perfil-vini.html" class="back">←</a>
      <h1>Vini Nights Auto</h1>
      <span class="spacer"></span>
    </div>

    <div class="chat-body">
      <div class="msg msg-in">Boa noite! Qual o sintoma que o carro tá dando?</div>
      <div class="msg msg-out">A luz de injeção acendeu no painel e ele perdeu força</div>
      <div class="msg msg-in">Pode ser sensor de fluxo ou vela. Consegue trazer hoje até às 19h pra gente escanear?</div>
      <div class="msg msg-out">Consigo sim, chego em 30 minutos</div>
    </div>

    <div style="display:flex; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line);">
      <input type="text" placeholder="Escreva uma mensagem..." style="flex:1; background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 20px; padding: 10px 16px; color: var(--text);">
      <button style="background: var(--accent); color:#17181A; border:none; border-radius:50%; width:40px; height:40px; font-weight:700; cursor:pointer;">➤</button>
    </div>
  </div>
</div>
</body>
</html>
