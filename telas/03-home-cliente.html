<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWB Customs — Início</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="root"></div>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script>
CWB.page({ roles: ['cliente'], title: (u) => 'Olá, ' + u.nome.split(' ')[0], tab: 'home', back: null,
  render(el, u) {
    const ativos = DB.where('agendamentos', (a) => a.clienteId == u.id && ['solicitado', 'confirmado', 'em_andamento', 'pronto'].includes(a.status)).sort((a, b) => b.criadoEm - a.criadoEm);
    const abertos = DB.where('orcamentos', (o) => o.clienteId == u.id && o.status === 'aberto');
    el.innerHTML = `
      <a href="04-mapa-oficinas.html" class="card" style="display:block; text-decoration:none; margin-bottom:32px;">
        <h3 style="color: var(--accent); margin-bottom:4px;">Precisa de uma oficina agora?</h3>
        <h2 style="margin-bottom:4px;">Buscar oficinas próximas →</h2>
        <p style="margin:0;">Veja avaliação, distância e disponibilidade</p>
      </a>

      <h3 style="margin-bottom:12px;">Seus serviços em andamento</h3>
      ${ativos.length ? ativos.slice(0, 3).map((a) => {
        const of = DB.get('oficinas', a.oficinaId);
        return `<a href="09-acompanhamento.html?id=${a.id}" class="card-flat" style="display:block; text-decoration:none;">
          <div class="row" style="margin-bottom:8px"><strong>${CWB.esc(of.nome)}</strong>${CWB.statusBadge(a.status)}</div>
          <p style="margin:0;font-size:14px">${CWB.esc(a.servico)} — ${CWB.esc(CWB.veiculoNome(DB.get('veiculos', a.veiculoId)))}</p></a>`;
      }).join('') : `<div class="empty"><strong>Nenhum serviço em andamento</strong><p>Agende um serviço ou peça um orçamento.</p></div>`}

      ${abertos.length ? `<a href="21-comparar-orcamentos.html" class="card-flat" style="display:block; text-decoration:none;"><div class="row"><strong>Orçamentos em aberto</strong>${CWB.badge(abertos.length + ' pedido(s)', 'accent')}</div><p style="margin:6px 0 0;font-size:13px">Compare as propostas recebidas →</p></a>` : ''}

      <h3 style="margin: 32px 0 12px;">Acesso rápido</h3>
      <div class="grid2">
        <a href="08-orcamento.html" class="card-flat tile"><div class="ic">📋</div><div class="tx">Pedir orçamento</div></a>
        <a href="06-agendamento.html" class="card-flat tile"><div class="ic">📅</div><div class="tx">Agendar serviço</div></a>
        <a href="19-sinistro.html" class="card-flat tile"><div class="ic">🛡️</div><div class="tx">Abrir sinistro</div></a>
        <a href="07-chat.html" class="card-flat tile"><div class="ic">💬</div><div class="tx">Falar com oficina</div></a>
        <a href="22-meus-veiculos.html" class="card-flat tile"><div class="ic">🚗</div><div class="tx">Meus veículos</div></a>
        <a href="24-historico-servicos.html" class="card-flat tile"><div class="ic">🧾</div><div class="tx">Histórico de serviços</div></a>
      </div>`;
  } });
</script>
</body>
</html>
