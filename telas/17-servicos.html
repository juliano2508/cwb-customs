<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWB Customs</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="root"></div>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script>
CWB.page({ roles: ['oficina'], title: 'Serviços e preços', tab: 'home', back: '13-home-oficina.html', render(el, u) {
  CWB.crud(el, {
    table: 'servicos', where: (s) => s.oficinaId == u.oficinaId, addTitle: 'Novo serviço', empty: 'Nenhum serviço cadastrado.',
    intro: 'Os serviços abaixo aparecem no perfil da oficina e no agendamento do cliente.',
    item: (s) => ({ title: s.nome, sub: 'A partir de ' + CWB.money(s.preco) }),
    fields: [
      { key: 'nome', label: 'Nome do serviço', required: true, placeholder: 'Ex: Alinhamento e balanceamento' },
      { key: 'preco', label: 'Preço a partir de (R$)', type: 'money', required: true },
    ],
    defaults: () => ({ oficinaId: u.oficinaId }),
  });
} });
</script>
</body>
</html>
